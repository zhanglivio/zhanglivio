name: Deploy to GitHub Pages

# 仅手动触发：仓库所有者在 Settings→Pages 把 Source 设为 “GitHub Actions” 后，
# 可在 Actions 页点 “Run workflow” 部署。若用更简单的 “Deploy from a branch”
# 方式（推荐），则无需本工作流。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
