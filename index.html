<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欧洲客户经营雷达 · Europe Coverage Radar</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="logo">◧</span>
      <span>欧洲客户经营雷达 <small>Coverage Radar</small></span>
    </div>
    <nav class="breadcrumb" id="breadcrumb"></nav>

    <!-- 视角（透镜）切换 -->
    <div class="lens-switch" id="lensSwitch">
      <button data-lens="density" class="active">客户密度</button>
      <button data-lens="cold">久未联系</button>
      <button data-lens="debt">欠款</button>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <main id="stage">
    <svg id="map"></svg>

    <button class="back-btn" id="backBtn" hidden>← 返回</button>

    <!-- 左侧洞察排行榜：空白区 + 最冷区 -->
    <aside class="insights" id="insights">
      <div class="ins-head">
        <span id="insTitle">洞察</span>
        <button id="insToggle" title="收起/展开">◀</button>
      </div>
      <div class="ins-body" id="insBody"></div>
    </aside>

    <div class="loading" id="loading">加载地图中…</div>

    <!-- 悬停客户卡片 -->
    <div class="tooltip" id="tooltip" hidden></div>

    <!-- 点击城市后的客户明细面板 -->
    <aside class="panel" id="panel" hidden>
      <div class="panel-head">
        <h2 id="panelTitle">城市</h2>
        <button id="panelClose">×</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <script src="assets/d3.min.js"></script>
  <script src="assets/europe.geojson.js"></script>
  <script src="assets/italy-regions.geojson.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
